<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Wiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
        body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f1923;color:#fff}
        .app{width:960px;height:540px;border-radius:20px;overflow:hidden;position:relative;display:flex;box-shadow:0 20px 60px rgba(0,0,0,.5)}
        .bg{position:absolute;inset:0;background:linear-gradient(135deg,#0d1b2a 0%,#1b3a4b 40%,#2d4a3e 100%);z-index:0}
        .bg::before{content:'';position:absolute;inset:0;background:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="30" r="1" fill="rgba(255,255,255,0.15)"/><circle cx="45" cy="15" r="0.8" fill="rgba(255,255,255,0.1)"/><circle cx="70" cy="45" r="1.2" fill="rgba(255,255,255,0.12)"/><circle cx="10" cy="80" r="0.6" fill="rgba(255,255,255,0.08)"/><circle cx="85" cy="20" r="0.9" fill="rgba(255,255,255,0.1)"/><circle cx="30" cy="60" r="0.7" fill="rgba(255,255,255,0.09)"/><circle cx="60" cy="70" r="1" fill="rgba(255,255,255,0.11)"/><circle cx="90" cy="85" r="0.8" fill="rgba(255,255,255,0.07)"/></svg>');background-size:120px;animation:rain 3s linear infinite;opacity:.6}
        @keyframes rain{0%{background-position:0 0}100%{background-position:20px 120px}}
        .left-panel{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:40px;z-index:1}
        .right-panel{width:380px;background:rgba(0,0,0,.45);backdrop-filter:blur(20px);padding:30px;z-index:1;display:flex;flex-direction:column;gap:20px}
        .app-logo{font-size:12px;color:rgba(255,255,255,.5);position:absolute;top:20px;left:24px;z-index:2}
        .temp{font-size:96px;font-weight:300;line-height:1}
        .temp span{font-size:48px;vertical-align:super}
        .location{font-size:22px;font-weight:500;margin-top:4px}
        .meta{font-size:13px;color:rgba(255,255,255,.5);margin-top:4px}

        .section-title{font-size:13px;color:rgba(255,255,255,.55);margin-bottom:10px}
        .hourly{display:flex;gap:12px}
        .hour-item{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,.7);min-width:52px;padding:10px 6px;border-radius:12px;background:rgba(255,255,255,.05);transition:.2s}
        .hour-item:first-child{background:rgba(255,255,255,.12)}
        .hour-item:hover{background:rgba(255,255,255,.1)}
        .hour-icon{font-size:22px}
        .hour-temp{font-weight:600;color:#fff}

        .forecast{display:flex;flex-direction:column;gap:6px}
        .forecast-row{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.04);transition:.2s}
        .forecast-row:hover{background:rgba(255,255,255,.08)}
        .forecast-day{width:50px;font-size:13px;font-weight:500}
        .forecast-icon{font-size:18px;width:30px;text-align:center}
        .forecast-temps{font-size:13px;color:rgba(255,255,255,.6)}
        .forecast-temps span{color:#fff;font-weight:600}
    </style>
</head>
<body>
    <div class="app">
        <div class="bg"></div>
        <div class="app-logo">weather.com</div>
        <div class="left-panel">
            <div class="temp">23<span>°C</span></div>
            <div class="location">Watermelon Park</div>
            <div class="meta">10:43 | H:32° L:19°</div>
        </div>
        <div class="right-panel">
            <div>
                <div class="section-title">Thunderstorms expected around 00:00</div>
                <div class="hourly">
                    <div class="hour-item"><span>Now</span><span class="hour-icon">🌧️</span><span class="hour-temp">23°</span></div>
                    <div class="hour-item"><span>01</span><span class="hour-icon">🌧️</span><span class="hour-temp">21°</span></div>
                    <div class="hour-item"><span>02</span><span class="hour-icon">🌧️</span><span class="hour-temp">20°</span></div>
                    <div class="hour-item"><span>03</span><span class="hour-icon">⛅</span><span class="hour-temp">23°</span></div>
                    <div class="hour-item"><span>04</span><span class="hour-icon">🌧️</span><span class="hour-temp">23°</span></div>
                </div>
            </div>
            <div>
                <div class="section-title">5-Day Forecast</div>
                <div class="forecast">
                    <div class="forecast-row"><span class="forecast-day">Today</span><span class="forecast-icon">🌧️</span><span class="forecast-temps"><span>18°</span></span></div>
                    <div class="forecast-row"><span class="forecast-day">Thu</span><span class="forecast-icon">🌧️</span><span class="forecast-temps"><span>20°</span></span></div>
                    <div class="forecast-row"><span class="forecast-day">Fri</span><span class="forecast-icon">⛅</span><span class="forecast-temps"><span>22°</span></span></div>
                    <div class="forecast-row"><span class="forecast-day">Sat</span><span class="forecast-icon">☀️</span><span class="forecast-temps"><span>25°</span></span></div>
                    <div class="forecast-row"><span class="forecast-day">Sun</span><span class="forecast-icon">🌧️</span><span class="forecast-temps"><span>23°</span></span></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
